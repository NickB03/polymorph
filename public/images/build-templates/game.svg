<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fdf2f8"/>
      <stop offset="100%" stop-color="#ede9fe"/>
    </linearGradient>
  </defs>
  <rect fill="url(#bg)" width="600" height="400" rx="12"/>
  <!-- Score bar -->
  <rect fill="#ffffff" x="20" y="16" width="120" height="32" rx="16" opacity="0.7"/>
  <rect fill="#f0abfc" x="32" y="24" width="16" height="16" rx="8"/>
  <rect fill="#e0e7ff" x="56" y="28" width="64" height="8" rx="4"/>
  <rect fill="#ffffff" x="460" y="16" width="120" height="32" rx="16" opacity="0.7"/>
  <rect fill="#c4b5fd" x="472" y="24" width="16" height="16" rx="8"/>
  <rect fill="#e0e7ff" x="496" y="28" width="64" height="8" rx="4"/>
  <!-- Game area -->
  <rect fill="#ffffff" x="60" y="72" width="480" height="260" rx="16" opacity="0.5"/>
  <!-- Game elements -->
  <circle fill="#a78bfa" cx="200" cy="180" r="28" opacity="0.8"/>
  <circle fill="#f0abfc" cx="380" cy="150" r="22" opacity="0.7"/>
  <circle fill="#6366f1" cx="300" cy="220" r="18" opacity="0.6"/>
  <rect fill="#c4b5fd" x="140" y="260" width="80" height="20" rx="4" opacity="0.5"/>
  <rect fill="#f0abfc" x="350" y="240" width="100" height="20" rx="4" opacity="0.5"/>
  <!-- Play button -->
  <circle fill="#7c3aed" cx="300" cy="190" r="36" opacity="0.9"/>
  <polygon fill="#ffffff" points="290,172 290,208 318,190"/>
  <!-- Controls hint -->
  <rect fill="#ffffff" x="180" y="352" width="240" height="32" rx="16" opacity="0.6"/>
  <rect fill="#e0e7ff" x="200" y="362" width="200" height="12" rx="4"/>
</svg>
