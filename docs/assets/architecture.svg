<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760">
  <style>
    text { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; }
  </style>
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2563eb"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#16a34a"/>
    </marker>
    <filter id="ds" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="#000" flood-opacity="0.06"/>
    </filter>
  </defs>
  <rect width="1200" height="760" fill="#ffffff"/>

  <text x="600" y="44" text-anchor="middle" font-size="20" font-weight="600" fill="#111827">Polymorph Architecture</text>
  <text x="600" y="66" text-anchor="middle" font-size="12" fill="#6b7280">Three-agent chat system with generative UI</text>

  <rect x="460" y="96" width="280" height="60" rx="8" ry="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5" filter="url(#ds)"/>
  <text x="600" y="123" text-anchor="middle" font-size="15" font-weight="600" fill="#111827">Chat UI</text>
  <text x="600" y="142" text-anchor="middle" font-size="12" fill="#6b7280">Next.js 16 · React 19 · Tailwind v4</text>

  <line x1="600" y1="156" x2="600" y2="206" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arrow-blue)"/>

  <rect x="380" y="212" width="440" height="84" rx="8" ry="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5" filter="url(#ds)"/>
  <rect x="380" y="212" width="440" height="4" rx="2" ry="2" fill="#2563eb"/>
  <text x="600" y="244" text-anchor="middle" font-size="16" font-weight="600" fill="#111827">Chat Agent Factory</text>
  <text x="600" y="265" text-anchor="middle" font-size="12" fill="#6b7280">resolves model · selects agent · ToolLoopAgent runtime</text>
  <text x="600" y="283" text-anchor="middle" font-size="11" fill="#9ca3af">lib/agents/chat/ · factory · registry</text>

  <path d="M 500 296 Q 390 327 280 327 V 358" stroke="#2563eb" stroke-width="1.8" fill="none" marker-end="url(#arrow-blue)"/>
  <line x1="600" y1="296" x2="600" y2="358" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arrow-blue)"/>
  <path d="M 700 296 Q 810 327 920 327 V 358" stroke="#2563eb" stroke-width="1.8" fill="none" marker-end="url(#arrow-blue)"/>

  <rect x="140" y="362" width="280" height="108" rx="8" ry="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5" filter="url(#ds)"/>
  <rect x="140" y="362" width="280" height="4" rx="2" ry="2" fill="#2563eb"/>
  <text x="280" y="394" text-anchor="middle" font-size="15" font-weight="600" fill="#111827">Search Agent</text>
  <text x="280" y="416" text-anchor="middle" font-size="12" fill="#6b7280">fast loop · 20 steps</text>
  <text x="280" y="438" text-anchor="middle" font-size="11" fill="#9ca3af">forced optimized search</text>
  <text x="280" y="455" text-anchor="middle" font-size="11" fill="#9ca3af">core + display tools</text>

  <rect x="460" y="362" width="280" height="108" rx="8" ry="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5" filter="url(#ds)"/>
  <rect x="460" y="362" width="280" height="4" rx="2" ry="2" fill="#7c3aed"/>
  <text x="600" y="394" text-anchor="middle" font-size="15" font-weight="600" fill="#111827">Research Agent</text>
  <text x="600" y="416" text-anchor="middle" font-size="12" fill="#6b7280">deep loop · 50 steps</text>
  <text x="600" y="438" text-anchor="middle" font-size="11" fill="#9ca3af">general / optimized search</text>
  <text x="600" y="455" text-anchor="middle" font-size="11" fill="#9ca3af">+ todoWrite · multimedia</text>

  <rect x="780" y="362" width="280" height="108" rx="8" ry="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5" filter="url(#ds)"/>
  <rect x="780" y="362" width="280" height="4" rx="2" ry="2" fill="#16a34a"/>
  <text x="920" y="394" text-anchor="middle" font-size="15" font-weight="600" fill="#111827">Build Agent</text>
  <text x="920" y="416" text-anchor="middle" font-size="12" fill="#6b7280">canvas compile loop</text>
  <text x="920" y="438" text-anchor="middle" font-size="11" fill="#9ca3af">single-artifact-per-chat</text>
  <text x="920" y="455" text-anchor="middle" font-size="11" fill="#9ca3af">live preview via iframe srcdoc</text>

  <line x1="280" y1="470" x2="280" y2="520" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arrow-blue)"/>
  <line x1="600" y1="470" x2="600" y2="520" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arrow-blue)"/>
  <line x1="920" y1="470" x2="920" y2="520" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arrow-blue)"/>

  <rect x="80" y="525" width="1040" height="130" rx="10" ry="10" fill="#fafafa" stroke="#d1d5db" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="100" y="546" font-size="12" font-weight="600" fill="#6b7280">TOOL SYSTEM</text>

  <rect x="100" y="560" width="235" height="80" rx="6" ry="6" fill="#ffffff" stroke="#d1d5db" stroke-width="1"/>
  <text x="217.5" y="584" text-anchor="middle" font-size="13" font-weight="600" fill="#111827">Core</text>
  <text x="217.5" y="603" text-anchor="middle" font-size="11" fill="#6b7280">search · fetch · todoWrite</text>
  <text x="217.5" y="622" text-anchor="middle" font-size="11" fill="#9ca3af">multi-provider routing</text>

  <rect x="355" y="560" width="235" height="80" rx="6" ry="6" fill="#ffffff" stroke="#d1d5db" stroke-width="1"/>
  <text x="472.5" y="584" text-anchor="middle" font-size="13" font-weight="600" fill="#111827">Display (Generative UI)</text>
  <text x="472.5" y="603" text-anchor="middle" font-size="11" fill="#6b7280">charts · tables · plans · citations</text>
  <text x="472.5" y="622" text-anchor="middle" font-size="11" fill="#9ca3af">callouts · timelines · option lists</text>

  <rect x="610" y="560" width="235" height="80" rx="6" ry="6" fill="#ffffff" stroke="#d1d5db" stroke-width="1"/>
  <text x="727.5" y="584" text-anchor="middle" font-size="13" font-weight="600" fill="#111827">Geo</text>
  <text x="727.5" y="603" text-anchor="middle" font-size="11" fill="#6b7280">geocode · directions · isochrones</text>
  <text x="727.5" y="622" text-anchor="middle" font-size="11" fill="#9ca3af">displayGeoMap · static maps</text>

  <rect x="865" y="560" width="235" height="80" rx="6" ry="6" fill="#ffffff" stroke="#d1d5db" stroke-width="1"/>
  <text x="982.5" y="584" text-anchor="middle" font-size="13" font-weight="600" fill="#111827">Canvas</text>
  <text x="982.5" y="603" text-anchor="middle" font-size="11" fill="#6b7280">create · update · read</text>
  <text x="982.5" y="622" text-anchor="middle" font-size="11" fill="#9ca3af">React → single-file HTML</text>

  <line x1="217.5" y1="655" x2="217.5" y2="695" stroke="#16a34a" stroke-width="1.8" marker-end="url(#arrow-green)"/>
  <line x1="600" y1="655" x2="600" y2="695" stroke="#16a34a" stroke-width="1.8" marker-end="url(#arrow-green)"/>
  <line x1="982.5" y1="655" x2="982.5" y2="695" stroke="#16a34a" stroke-width="1.8" marker-end="url(#arrow-green)"/>

  <rect x="100" y="697" width="235" height="52" rx="6" ry="6" fill="#f9fafb" stroke="#d1d5db" stroke-width="1"/>
  <text x="217.5" y="720" text-anchor="middle" font-size="13" font-weight="600" fill="#111827">Search Providers</text>
  <text x="217.5" y="738" text-anchor="middle" font-size="11" fill="#6b7280">Brave · Tavily · Exa · Firecrawl</text>

  <rect x="482.5" y="697" width="235" height="52" rx="6" ry="6" fill="#f9fafb" stroke="#d1d5db" stroke-width="1"/>
  <text x="600" y="720" text-anchor="middle" font-size="13" font-weight="600" fill="#111827">OpenRouter</text>
  <text x="600" y="738" text-anchor="middle" font-size="11" fill="#6b7280">DeepSeek text · Gateway images</text>

  <rect x="865" y="697" width="235" height="52" rx="6" ry="6" fill="#f9fafb" stroke="#d1d5db" stroke-width="1"/>
  <text x="982.5" y="720" text-anchor="middle" font-size="13" font-weight="600" fill="#111827">Postgres · Phoenix</text>
  <text x="982.5" y="738" text-anchor="middle" font-size="11" fill="#6b7280">Supabase + RLS · OTel traces</text>
</svg>
