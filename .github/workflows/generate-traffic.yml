name: Generate Traffic

on:
  schedule:
    # 14:00 UTC daily
    - cron: '0 14 * * *'
  workflow_dispatch:

jobs:
  generate-traffic:
    runs-on: ubuntu-latest
    name: Simulate user sessions

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9

      - name: Install dependencies
        run: bun install

      - name: Install Playwright browsers
        run: bunx playwright install chromium --with-deps

      - name: Run traffic simulation
        run: bun run generate-traffic
        env:
          TRAFFIC_TARGET_URL: https://polymorph.fyi
          POLYMORPH_COOKIES: ${{ secrets.POLYMORPH_COOKIES }}
