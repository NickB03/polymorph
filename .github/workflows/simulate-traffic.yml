name: Simulate Traffic

# Generates synthetic user sessions on polymorph.fyi daily so the eval
# cron has a baseline of production traffic to sample and score.
#
# Required repository secrets:
#   POLYMORPH_BYPASS_SECRET  — Vercel Deployment Protection bypass secret
#                              (Vercel dashboard → Settings → Deployment Protection
#                               → Bypass for Automation)
#
# Optional:
#   POLYMORPH_COOKIES        — Authenticated session cookies if you want the
#                              sessions to land under a specific user account
#                              (omit for guest sessions)

on:
  schedule:
    # 09:00 UTC daily — before the 48h eval cron window so fresh data is ready
    - cron: '0 9 * * *'
  workflow_dispatch:
    inputs:
      sessions:
        description: 'Number of sessions to run (1–10)'
        required: false
        default: '3'
      url:
        description: 'Target URL override (leave blank for production)'
        required: false

jobs:
  simulate:
    name: Run ${{ inputs.sessions || '3' }} sessions
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.9'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run traffic simulation
        env:
          SIMULATE_MODE: api
          SIMULATE_SESSIONS: ${{ inputs.sessions || '3' }}
          SIMULATE_URL: ${{ inputs.url || 'https://polymorph.fyi' }}
          POLYMORPH_BYPASS_SECRET: ${{ secrets.POLYMORPH_BYPASS_SECRET }}
          POLYMORPH_COOKIES: ${{ secrets.POLYMORPH_COOKIES }}
        run: bun run scripts/simulate-traffic.ts
