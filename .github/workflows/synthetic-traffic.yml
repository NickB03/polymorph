name: Synthetic Traffic

on:
  schedule:
    # Daily at noon UTC — gives the evals cron (every 48h) fresh data to sample
    - cron: '0 12 * * *'
  workflow_dispatch:

jobs:
  generate-traffic:
    name: Run 3 synthetic sessions
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.9'

      - name: Install root dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright + Chromium
        run: bunx playwright install chromium --with-deps

      - name: Run synthetic traffic sessions
        # continue-on-error so a partial run (e.g. one session fails) still
        # exits 0 — partial data is better than no data for the eval sampler.
        continue-on-error: true
        env:
          POLYMORPH_URL: https://polymorph.fyi
          POLYMORPH_TEST_EMAIL: ${{ secrets.POLYMORPH_TEST_EMAIL }}
          POLYMORPH_TEST_PASSWORD: ${{ secrets.POLYMORPH_TEST_PASSWORD }}
        run: bun run scripts/synthetic-traffic.ts
