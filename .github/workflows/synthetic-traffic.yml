name: Synthetic Traffic

on:
  schedule:
    - cron: '0 14 * * *' # 14:00 UTC daily
  workflow_dispatch: # Allow manual trigger from the Actions tab

jobs:
  generate-traffic:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9

      - name: Install dependencies
        run: bun install

      - name: Install Playwright browsers
        run: bunx playwright install chromium --with-deps

      - name: Run synthetic traffic sessions
        run: bun run scripts/synthetic-traffic.ts
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TRAFFIC_BOT_EMAIL: ${{ secrets.TRAFFIC_BOT_EMAIL }}
          TRAFFIC_BOT_PASSWORD: ${{ secrets.TRAFFIC_BOT_PASSWORD }}
          TRAFFIC_BOT_URL: https://polymorph.fyi
