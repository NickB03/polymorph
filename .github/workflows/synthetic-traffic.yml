name: Synthetic Traffic

on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:

jobs:
  generate-traffic:
    runs-on: ubuntu-latest
    name: Generate synthetic sessions

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9

      - name: Install dependencies
        run: bun install

      - name: Run synthetic traffic sessions
        env:
          POLYMORPH_COOKIES: ${{ secrets.POLYMORPH_COOKIES }}
          POLYMORPH_URL: https://polymorph.fyi
        run: bun run scripts/synthetic-traffic.ts
