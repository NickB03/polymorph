name: Synthetic Traffic

on:
  schedule:
    # Runs daily at 14:00 UTC — within the evals 48-hour lookback window
    - cron: '0 14 * * *'
  workflow_dispatch:

jobs:
  run:
    name: Generate user sessions
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9

      - name: Install dependencies
        run: bun install

      - name: Install Playwright browser
        run: bunx playwright install chromium --with-deps

      - name: Run synthetic traffic
        run: bun run scripts/synthetic-traffic.ts
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SEED_USER_EMAIL: ${{ secrets.SEED_USER_EMAIL }}
          SEED_USER_PASSWORD: ${{ secrets.SEED_USER_PASSWORD }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          APP_URL: https://polymorph.fyi
