name: Synthetic Traffic

on:
  schedule:
    # 14:00 UTC daily — runs ~6–8 h before the 48-h eval cron window
    - cron: '0 14 * * *'
  workflow_dispatch:
    inputs:
      session_count:
        description: 'Number of sessions (default: 3)'
        required: false
        default: '3'
      headless:
        description: 'Run headless? (true/false)'
        required: false
        default: 'true'

jobs:
  traffic:
    name: Simulate user sessions
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.9'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: Run synthetic traffic
        run: bun run synthetic-traffic
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SYNTH_TRAFFIC_COOKIES: ${{ secrets.SYNTH_TRAFFIC_COOKIES }}
          SYNTH_SESSION_COUNT: ${{ github.event.inputs.session_count || '3' }}
          SYNTH_HEADLESS: ${{ github.event.inputs.headless || 'true' }}
