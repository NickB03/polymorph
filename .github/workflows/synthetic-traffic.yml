name: Synthetic Traffic

on:
  schedule:
    - cron: '0 8 * * *' # 08:00 UTC daily
  workflow_dispatch: # manual trigger from the GitHub Actions UI

jobs:
  generate-traffic:
    name: Generate 3 synthetic user sessions
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9

      - name: Install dependencies
        run: bun install
        env:
          # Prevent playwright's postinstall from downloading browsers here;
          # we install only what we need in the next step.
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

      - name: Install Playwright Chromium
        run: bunx playwright install chromium --with-deps

      - name: Run synthetic traffic
        run: bun run synthetic-traffic
        env:
          APP_URL: https://polymorph.fyi
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SEED_USER_EMAIL: ${{ secrets.SEED_USER_EMAIL }}
          SEED_USER_PASSWORD: ${{ secrets.SEED_USER_PASSWORD }}
