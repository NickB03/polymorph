name: Synthetic Traffic

on:
  schedule:
    - cron: '0 14 * * *' # 14:00 UTC daily
  workflow_dispatch: # manual trigger via GitHub UI → Actions → Run workflow

jobs:
  generate-traffic:
    runs-on: ubuntu-latest
    name: Generate synthetic traffic
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9

      - name: Install dependencies
        run: bun install

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run synthetic traffic
        run: bun run traffic
        timeout-minutes: 35
        env:
          TRAFFIC_BOT_EMAIL: ${{ secrets.TRAFFIC_BOT_EMAIL }}
          TRAFFIC_BOT_PASSWORD: ${{ secrets.TRAFFIC_BOT_PASSWORD }}
          POLYMORPH_URL: https://polymorph.fyi

      - name: Upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: traffic-failure-screenshots
          path: /tmp/traffic-fail-*.png
          retention-days: 7
          if-no-files-found: ignore
