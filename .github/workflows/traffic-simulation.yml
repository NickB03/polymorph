name: Traffic Simulation

on:
  schedule:
    - cron: '0 3 * * *' # 03:00 UTC daily
  workflow_dispatch:
    inputs:
      headless:
        description: Run headless browser
        default: 'true'
        type: boolean

jobs:
  simulate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    name: Simulate user traffic on polymorph.fyi

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9

      - name: Install dependencies
        run: bun install

      - name: Install Playwright + Chromium system deps
        run: bunx playwright install chromium --with-deps

      - name: Run traffic simulation
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          POLYMORPH_TEST_EMAIL: ${{ secrets.POLYMORPH_TEST_EMAIL }}
          POLYMORPH_TEST_PASSWORD: ${{ secrets.POLYMORPH_TEST_PASSWORD }}
          SIMULATION_HEADLESS: ${{ inputs.headless || 'true' }}
        run: bun run scripts/simulate-traffic.ts
